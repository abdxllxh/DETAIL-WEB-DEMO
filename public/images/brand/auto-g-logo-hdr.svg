<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 100" role="img" aria-labelledby="title desc">
  <title id="title">AUTO.G Detailing</title>
  <desc id="desc">Transparent AUTO.G Detailing wordmark in white, silver, and orange.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb15a"/>
      <stop offset=".28" stop-color="#ff8a1c"/>
      <stop offset="1" stop-color="#e95700"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f6f4"/>
      <stop offset="1" stop-color="#9da3a5"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- Transparent canvas: only the mark and wordmark are drawn. -->
  <g filter="url(#soft-shadow)">
    <circle cx="166" cy="32" r="11" fill="url(#silver)"/>
    <circle cx="194" cy="18" r="9" fill="url(#orange)"/>
    <circle cx="194" cy="61" r="29" fill="url(#orange)" stroke="#d85a0b" stroke-width="1.5"/>
  </g>
  <g transform="translate(8 12) skewX(-9)" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-weight="900">
    <text x="0" y="58" font-size="47" letter-spacing="-2.8" fill="#fff">AUTO.</text>
    <text x="163" y="74" font-size="45" letter-spacing="-3" fill="#fff">G</text>
  </g>
  <text x="232" y="65" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3.6" fill="#aeb5b7">DETAILING</text>
</svg>
